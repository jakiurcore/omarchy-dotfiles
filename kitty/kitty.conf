##########################################
# A kitty config by null
#########################################

# Font
font_family JetBrainsMono Nerd Font
disable_ligatures never
font_size 12
bold_font auto
italic_font auto
bold_italic_font auto
modify_font cell_height 110%
modify_font strikethrough_position 110%

# cursor
cursor #ffcb47
cursor_text_color #000000
cursor_shape block
cursor_shape_unfocused beam
cursor_blink_interval -1
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# performance
repaint_delay 10
input_delay 3
sync_to_monitor yes
wayland_enable_ime no

# tab bar
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 2
tab_bar_edge bottom
active_tab_font_style bold
inactive_tab_font_style normal

# scrollback
scrollback_lines 5000
scrollback_indicator_opacity 1.0

# mouse
mouse_hide_wait -1

# new tag with pwd
map ctrl+shift+t new_tab_with_cwd

#url
url_color #0087bd
url_style curly
open_url_with default
url_prefixes file ftp ftps gemini git gopher http https irc ircs kitty mailto news sftp ssh
detect_urls yes
show_hyperlink_targets no
underline_hyperlink always
strip_trailing_spaces always

# stop the sound of the bell
enable_audio_bell no
visual_bell_duration 0.0
command_on_bell none

# window
remember_window_size  yes
initial_window_width  640
initial_window_height 400
active_border_color #ffcb47
inactive_border_color #444444
enable_layouts *
hide_window_decorations yes
confirm_os_window_close 0
scrollback_pager_history_size 10

# border
window_border_width 2pt
draw_minimal_border yes
window_margin_width 5
window_padding_width 5

# background
#   background_image ~/.local/state/omarchy/current/background
#   background_image_layout scaled
#   background_tint 0.95
#   dim_opacity 1

# remote control support
allow_remote_control yes
remote_control_password "nullx" get-colors set-colors focus-window focus-tab
remote_control_password "nullx" set-tab-* resize-*
kitten @ --help

# clipbaord
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask

# shell integration
shell_integration enabled

# # include theme
# include ~/.config/kitty/dracula.conf


# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME

# Send Shift+Enter as CSI-u so TUIs can distinguish it from Enter.
map shift+enter send_text all \e[13;2u

# Kitty legacy encoding sends Alt+Shift+Enter the same as Alt+Enter; send CSI-u so tmux can match M-S-Enter.
map alt+shift+enter send_text all \e[13;4u

# Allow cwd lookup from global keybindings
listen_on unix:${XDG_RUNTIME_DIR}/omarchy-kitty-{kitty_pid}
